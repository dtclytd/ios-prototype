name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build PrototypeApp
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app icon
        run: python3 tools/make_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PrototypeApp.xcodeproj \
            -scheme PrototypeApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/PrototypeApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "构建产物不存在：$APP_PATH"
            exit 1
          fi
          rm -rf Payload PrototypeApp.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PrototypeApp.ipa Payload
          ls -lh PrototypeApp.ipa
          echo "IPA 已生成：$(pwd)/PrototypeApp.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrototypeApp-unsigned-ipa
          path: PrototypeApp.ipa
          if-no-files-found: error
          retention-days: 30
